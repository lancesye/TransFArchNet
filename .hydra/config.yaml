dataset:
  svm:
    test:
      _base_: cfgs/dataset/ModelNet40_SVM.yaml
      others:
        num_points: 1024
        partition: test
    train:
      _base_: cfgs/dataset/ModelNet40_SVM.yaml
      others:
        num_points: 1024
        partition: train
    val:
      _base_: cfgs/dataset/ModelNet40_SVM.yaml
      others:
        num_points: 1024
        partition: test
  test:
    _base_: cfgs/dataset/ShapeNet-55.yaml
    others:
      npoints: 2048
      subset: test
  train:
    _base_: cfgs/dataset/ShapeNet-55.yaml
    others:
      npoints: 2048
      subset: train
  val:
    _base_: cfgs/dataset/ShapeNet-55.yaml
    others:
      npoints: 2048
      subset: test
max_epoch: 300
model:
  NAME: Point_M2AE
  decoder_depths:
  - 1
  - 1
  decoder_dims:
  - 384
  - 192
  decoder_up_blocks:
  - 1
  - 1
  drop_path_rate: 0.1
  encoder_depths:
  - 5
  - 5
  - 5
  encoder_dims:
  - 96
  - 192
  - 384
  group_sizes:
  - 32
  - 16
  - 16
  local_radius:
  - 0.32
  - 0.64
  - 1.28
  num_groups:
  - 1024
  - 512
  - 128
  num_heads: 6
npoints: 10000
optimizer:
  kwargs:
    lr: 0.001
    weight_decay: 0.05
  type: AdamW
scheduler:
  kwargs:
    epochs: 400
    initial_epochs: 10
  type: CosLR
step_per_update: 1
total_bs: 2
